name: CI - develop

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  actualizar-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Anadir linea al README.md
        run: |
          echo "Anadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Commit y push del README
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Actualiza README con la feature de la rama" || echo "Sin cambios"
          git push

  validar-secret:
    needs: actualizar-readme
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "OK - Los tokens COINCIDEN"
          } else {
            Write-Host "FAIL - Los tokens NO coinciden"
            exit 1
          }
